<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');
        
        :root {
            --error-color: #ff4444;
            --error-light: #ff6b6b;
            --text-color: #333;
            --bg-color: #f9f9f9;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }
        
        .failure-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .failure-icon {
            font-size: 80px;
            color: var(--error-color);
            margin-bottom: 20px;
            animation: shake 0.8s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
        
        h1 {
            color: var(--error-color);
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        p {
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 16px;
        }
        
        .error-details {
            background: #fff5f5;
            border-left: 4px solid var(--error-color);
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-retry {
            background: var(--error-color);
            color: white;
            border: 2px solid var(--error-color);
        }
        
        .btn-retry:hover {
            background: var(--error-light);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 70, 70, 0.2);
        }
        
        .btn-home {
            background: white;
            color: var(--error-color);
            border: 2px solid var(--error-color);
        }
        
        .btn-home:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
        }
        
        .contact-support {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
        }
        
        .contact-support a {
            color: var(--error-color);
            font-weight: 500;
            text-decoration: none;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <div class="failure-container">
        <div class="failure-icon">✕</div>
        <h1>Payment Failed</h1>
        <p>We couldn't process your payment. Please check your payment details and try again.</p>
        
        <div class="error-details">
            <strong>Possible reasons:</strong>
            <ul>
                <li>Insufficient funds in your account</li>
                <li>Incorrect card details</li>
                <li>Network issues</li>
                <li>Payment authorization failed</li>
            </ul>
        </div>
        
        <div class="action-buttons">
            <a href="{% url 'payment_page' %}" class="btn btn-retry pulse">Try Again</a>
            <a href="{% url 'home' %}" class="btn btn-home">Return Home</a>
        </div>
        
        <div class="contact-support">
            Need help? <a href="mailto:ganaganiganesh5268@gmail.com">Contact our support team</a>
        </div>
    </div>
</body>
</html>
