{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complete Your UPI Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Animated Gradient Background */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, #1d2b64, #f8cdda);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Main Container */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      min-height: calc(100vh - 4rem);
    }
    
    /* Glass effect card with blur & fade-in */
    .card {
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(31,38,135,0.37);
      animation: fadeIn 0.8s ease-in-out;
      width: 100%;
      max-width: 1000px;
      margin: 2rem 0;
      overflow: hidden;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Card Header Styling */
    .card-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 1.5rem;
      text-align: center;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .card-header h3 {
      margin: 0;
      font-weight: 700;
      font-size: 1.8rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
      letter-spacing: 0.5px;
    }
    
    /* Card Body */
    .card-body {
      padding: 2rem;
    }
    
    /* Payment Summary Section */
    .payment-summary {
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 0 1rem;
    }
    .payment-summary h4 {
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 1.4rem;
    }
    .payment-summary .display-4 {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0.5rem 0;
      background: linear-gradient(90deg,rgb(3, 252, 61),rgb(43, 32, 201));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .payment-summary p {
      color:rgb(8, 8, 8);
      font-size: 0.95rem;
      font-weight: 600;
    }
    
    /* QR Code Section */
    .qr-section {
      background: rgba(255,255,255,0.7);
      border-radius: 15px;
      padding: 2rem 1.5rem;
      margin-bottom: 1.5rem;
      height: 100%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }
    .qr-section:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgb(39, 1, 252);
    }
    .qr-section h5 {
      font-weight: 600;
      margin-bottom: 1.5rem;
      color:rgb(253, 52, 2);
      font-size: 1.2rem;
    }
    .qr-code img {
      width: 100%;
      max-width: 220px;
      height: auto;
      display: block;
      margin: 0 auto 1.5rem;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }
    .qr-code img:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgb(39, 1, 252);
    }
    .qr-section p {
      color:rgb(255, 81, 0);
      font-size: 0.9rem;
      margin-top: 1rem;
    }
    
    /* Manual Payment Section */
    .manual-payment {
      background: rgba(255,255,255,0.7);
      border-radius: 15px;
      padding: 2rem 1.5rem;
      height: 100%;
      box-shadow: 0 5px 15px rgba(44, 255, 2, 0.31);
    }
    .manual-payment h5 {
      font-weight: 600;
      margin-bottom: 1.5rem;
      color:rgb(74, 73, 87);
      font-size: 1.2rem;
      text-align: center;
    }
    
    /* Form Group Styling */
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-label {
      display: block;
      margin-bottom: 0.6rem;
      font-weight: 500;
      color: #495057;
      font-size: 0.95rem;
    }
    
    /* Input Group for UPI ID */
    .input-group {
      display: flex;
      align-items: center;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }
    .input-group:hover {
      box-shadow: 0 4px 12px rgba(2, 253, 241, 0.75);
    }
    .input-group input.form-control {
      border: none;
      background: transparent;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      flex: 1;
      min-width: 0;
    }
    .input-group input.form-control:focus {
      box-shadow: none;
    }
    .input-group .btn {
      border: none;
      background: linear-gradient(45deg, #6a11cb, #2575fc);
      color: #fff;
      padding: 0.8rem 1.2rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .input-group .btn:hover {
      background: linear-gradient(45deg, #2575fc, #6a11cb);
      transform: none;
    }
    
    /* Form Control Enhancements */
    .form-control {
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.9);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .form-control:focus {
      border-color: #764ba2;
      box-shadow: 0 0 0 0.25rem rgba(118,75,162,0.15);
    }
    .form-control[readonly] {
      background-color: rgba(255,255,255,0.7);
    }
    
    /* Reference Input Section */
    .reference-input {
      margin: 2rem 0 1.5rem;
    }
    .reference-input .form-label {
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }
    .reference-input .form-control {
      padding: 1rem;
      font-size: 1rem;
    }
    
    /* Button Styling */
    .btn {
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 10px;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn i {
      margin-right: 8px;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    }
    .btn-lg {
      padding: 1.1rem 2rem;
      font-size: 1.1rem;
    }
    
    /* Specific Button Colors */
    .btn-success {
      background: linear-gradient(45deg, #00b09b, #96c93d);
      border: none;
      color: #fff;
    }
    .btn-success:hover {
      background: linear-gradient(45deg, #96c93d, #00b09b);
      color: #fff;
    }
    .btn-outline-secondary {
      background: transparent;
      border: 2px solid #6c757d;
      color: #6c757d;
      transition: all 0.3s;
    }
    .btn-outline-secondary:hover {
      background:rgba(255, 255, 255, 0.2);
      color: rgb(248, 53, 4);;
      border-color:rgb(64, 252, 242);
    }
    
    /* Button Container */
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }
    
    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .container {
        padding: 1.5rem 1rem;
      }
      .card {
        margin: 1rem 0;
        border-radius: 15px;
      }
      .card-header h3 {
        font-size: 1.5rem;
      }
      .card-body {
        padding: 1.5rem;
      }
      .payment-summary .display-4 {
        font-size: 2.2rem;
      }
      .qr-section, .manual-payment {
        margin-bottom: 1.5rem;
      }
      .btn-lg {
        padding: 1rem 1.5rem;
      }
    }
    
    @media (max-width: 576px) {
      .card-header {
        padding: 1.2rem;
      }
      .card-header h3 {
        font-size: 1.3rem;
      }
      .payment-summary h4 {
        font-size: 1.2rem;
      }
      .payment-summary .display-4 {
        font-size: 2rem;
      }
      .qr-section, .manual-payment {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container my-5">
      <div class="row justify-content-center">
          <div class="col-lg-9">
              <div class="card shadow-lg">
                  <div class="card-header">
                      <h3 class="mb-0"><i class="bi bi-wallet2 me-2"></i>Complete Your UPI Payment</h3>
                  </div>
                  <div class="card-body">
                      <div class="payment-summary">
                          <h4>Pay with {{ payment_method|upper }}</h4>
                          <div class="display-4">₹{{ amount }}</div>
                          <p>For {{ ticket_type|title }} Ticket</p>
                      </div>
  
                      <div class="row">
                          <div class="col-md-6 mb-4 mb-md-0">
                              <div class="qr-section">
                                  <h5><i class="bi bi-qr-code me-2"></i>Scan QR Code</h5>
                                  <div class="qr-code">
                                      <img src="{% static 'images/phonepe.png' %}" alt="UPI QR Code">
                                  </div>
                                  <p>Scan this code in your UPI app to complete payment</p>
                              </div>
                          </div>
                          <div class="col-md-6">
                              <div class="manual-payment">
                                  <h5><i class="bi bi-credit-card me-2"></i>Manual Payment</h5>
                                  <div class="form-group">
                                      <label class="form-label">UPI ID</label>
                                      <div class="input-group">
                                          <input type="text" class="form-control" value="{{ merchant_upi }}" id="upi-id" readonly>
                                          <button class="btn" onclick="copyUpiId()">
                                              <i class="bi bi-clipboard"></i> Copy
                                          </button>
                                      </div>
                                  </div>
                                  <div class="form-group">
                                      <label class="form-label">Merchant Name</label>
                                      <input type="text" class="form-control" value="{{ merchant_name }}" readonly>
                                  </div>
                                  <div class="form-group">
                                      <label class="form-label">Amount</label>
                                      <input type="text" class="form-control" value="₹{{ amount }}" readonly>
                                  </div>
                              </div>
                          </div>
                      </div>
  
                      <form method="post">
                          {% csrf_token %}
                          <div class="reference-input">
                              <label for="reference" class="form-label"><i class="bi bi-receipt me-2"></i>Enter UPI Reference Number</label>
                              <input type="text" class="form-control" id="reference" name="reference" required 
                                     placeholder="Enter transaction reference from your banking app">
                          </div>
                          <div class="button-container">
                              <button type="submit" class="btn btn-success btn-lg">
                                  <i class="bi bi-check-circle me-2"></i> Confirm Payment
                              </button>
                              <a href="{% url 'payment_page' %}" class="btn btn-outline-secondary">
                                  <i class="bi bi-arrow-left me-2"></i> Change Payment Method
                              </a>
                          </div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
  </div>
  
  <script>
    function copyUpiId() {
      const upiId = document.getElementById('upi-id');
      upiId.select();
      document.execCommand('copy');
      
      // Create and show feedback element
      const feedback = document.createElement('div');
      feedback.style.position = 'fixed';
      feedback.style.top = '20px';
      feedback.style.left = '50%';
      feedback.style.transform = 'translateX(-50%)';
      feedback.style.backgroundColor = '#28a745';
      feedback.style.color = 'white';
      feedback.style.padding = '10px 20px';
      feedback.style.borderRadius = '5px';
      feedback.style.boxShadow = '0 4px 8px rgba(0,0,0,0.2)';
      feedback.style.zIndex = '9999';
      feedback.style.transition = 'all 0.3s ease';
      feedback.innerHTML = '<i class="bi bi-check-circle me-2"></i> UPI ID Copied!';
      document.body.appendChild(feedback);
      
      // Remove after animation
      setTimeout(() => {
        feedback.style.opacity = '0';
        feedback.style.top = '10px';
        setTimeout(() => feedback.remove(), 300);
      }, 2000);
    }
  </script>
</body>
</html>
