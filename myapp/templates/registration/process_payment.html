<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment - Ghani Travels</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        .payment-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            width: 90%;
            max-width: 400px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid transparent;
            border-top: 6px solid #ff5733;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .processing-text {
            font-size: 1.3rem;
            color: #333;
            font-weight: bold;
        }

        .dots span {
            animation: blink 1.5s infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.3s; }
        .dots span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .success-message {
            display: none;
            font-size: 1.5rem;
            color: green;
            font-weight: bold;
            animation: fadeIn 1s;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h2>Processing Your Payment</h2>
        <div class="loading-spinner"></div>
        <p class="processing-text">Please wait<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
        <p class="success-message">Payment Successful! ✅</p>
    </div>

    <script>
        setTimeout(() => {
            document.querySelector('.loading-spinner').style.display = 'none';
            document.querySelector('.processing-text').style.display = 'none';
            document.querySelector('.success-message').style.display = 'block';
        }, 4000); // Simulate processing time
    </script>
</body>
</html>
