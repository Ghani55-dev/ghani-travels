{% block content %}
<style>
    /* Global Styles */
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes glow {
        0% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.6); }
        50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
        100% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.6); }
    }

    @keyframes neonBorder {
        0% { border-color: rgba(59, 130, 246, 0.6); }
        50% { border-color: rgba(59, 130, 246, 0.8); }
        100% { border-color: rgba(59, 130, 246, 0.6); }
    }

    @keyframes slideIn {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(-45deg, #040131, #080130, #0e0144, #013801);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 20px;
        animation: gradientBG 10s ease infinite;
        background-size: 400% 400%;
    }

    /* Chat Container */
    .chat-container {
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(59, 130, 246, 0.6);
        border-radius: 20px;
        padding: 2rem;
        margin: 2rem;
        width: 90%;
        max-width: 800px;
        animation: neonBorder 3s infinite, glow 3s infinite;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    /* Chat Header */
    .chat-header {
        background: rgba(255, 255, 255, 0.1);
        border-bottom: 2px solid rgba(59, 130, 246, 0.6);
        padding: 1.5rem;
        text-align: center;
    }

    .chat-header h1 {
        font-size: 2rem;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 0.5rem;
    }

    .chat-header p {
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.8);
    }

    /* Chat Box */
    #chat-box {
        height: 400px;
        overflow-y: auto;
        padding: 1rem;
        scrollbar-width: thin;
        scrollbar-color: #3b82f6 #f1f5f9;
    }

    #chat-box::-webkit-scrollbar {
        width: 6px;
    }

    #chat-box::-webkit-scrollbar-track {
        background: #f1f5f9;
    }

    #chat-box::-webkit-scrollbar-thumb {
        background-color: #3b82f6;
        border-radius: 20px;
    }

    /* Messages */
    .user-message {
        background: #3b82f6;
        color: white;
        border-radius: 1rem 1rem 0 1rem;
        animation: slideIn 0.3s ease-out;
        max-width: 80%;
        margin-left: auto;
        padding: 1rem;
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
    }

    .ai-message {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border: 2px solid rgba(59, 130, 246, 0.6);
        border-radius: 1rem 1rem 1rem 0;
        animation: slideIn 0.3s ease-out;
        max-width: 80%;
        margin-right: auto;
        padding: 1rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* Typing Indicator */
    .typing-indicator {
        display: none;
        padding: 1rem;
        color: rgba(255, 255, 255, 0.8);
        font-style: italic;
    }

    .typing-dots {
        display: inline-flex;
        gap: 0.25rem;
    }

    .typing-dot {
        width: 0.5rem;
        height: 0.5rem;
        background: #94a3b8;
        border-radius: 50%;
        animation: pulse 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    /* Input Area */
    #chat-form {
        padding: 1rem;
        background: rgba(255, 255, 255, 0.1);
        border-top: 2px solid rgba(59, 130, 246, 0.6);
    }

    #user-input {
        width: 100%;
        padding: 0.8rem;
        border: 2px solid rgba(59, 130, 246, 0.6);
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        resize: none;
        scrollbar-width: none;
    }

    #user-input:focus {
        border-color: rgba(59, 130, 246, 0.8);
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        background: rgba(255, 255, 255, 0.2);
    }

    #user-input::-webkit-scrollbar {
        display: none;
    }

    /* Send Button */
    #chat-form button {
        margin-top: 1rem;
        padding: 0.8rem 1.5rem;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        position: relative;
        overflow: hidden;
    }

    #chat-form button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
    }

    #chat-form button::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        transform: rotate(45deg);
        transition: all 0.5s ease;
    }

    #chat-form button:hover::after {
        animation: shine 1.5s;
    }

    @keyframes shine {
        0% { transform: translateX(-100%) rotate(45deg); }
        100% { transform: translateX(100%) rotate(45deg); }
    }
</style>

<div class="chat-container">
    <div class="chat-header">
        <h1>AI Assistant <span>🤖</span></h1>
        <p>Powered by Advanced AI</p>
    </div>

    <div id="chat-box">
        <div class="ai-message">
            Hello! How can I help you today?
            <div class="message-timestamp">Just now</div>
        </div>
    </div>

    <div class="typing-indicator">
        <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
    </div>

    <form id="chat-form">
        {% csrf_token %} 
        <textarea id="user-input" placeholder="Type your message..." rows="1"></textarea>
        <button type="submit">Send 🚀</button>
    </form>
</div>

<script>
   document.getElementById('chat-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const userInput = document.getElementById('user-input');
    const message = userInput.value.trim();

    if (!message) {
        alert('Please enter a message.');
        return;
    }

    const chatBox = document.getElementById('chat-box');
    const typingIndicator = document.querySelector('.typing-indicator');

    // Add user message
    addMessage(message, 'user');
    userInput.value = '';

    // Show typing indicator
    typingIndicator.style.display = 'block';
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        // Get the CSRF token from the form
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        // Send the message to the backend
        const response = await fetch('/ai-chat/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken,
            },
            body: JSON.stringify({ message }),
        });

        // Handle non-JSON responses
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Server error: ${response.status} - ${errorText}`);
        }

        // Parse the JSON response
        const data = await response.json();

        if (data.response) {
            addMessage(data.response, 'ai');
        } else if (data.error) {
            throw new Error(data.error);
        } else {
            throw new Error('No response from AI');
        }
    } catch (error) {
        addMessage(`Error: ${error.message}`, 'error');
        console.error('Error:', error);
    } finally {
        // Hide typing indicator
        typingIndicator.style.display = 'none';
    }
});

function addMessage(content, sender) {
    const chatBox = document.getElementById('chat-box');
    const messageDiv = document.createElement('div');
    const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    messageDiv.className = `${sender}-message`;
    messageDiv.innerHTML = `
        ${content}
        <div class="message-timestamp">${timestamp}</div>
    `;

    chatBox.appendChild(messageDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}
    
    // Auto-resize textarea
    document.getElementById('user-input').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
    });
</script>

{% endblock %}
