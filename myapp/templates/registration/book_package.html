<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
           
        }

        /* Container Animation and Styling */
        .booking-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            width: 500px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px rgba(255, 255, 255, 0.2);
            }
            100% {
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 40px rgba(255, 255, 255, 0.4);
            }
        }

        /* Heading Styling */
        .booking-container h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Form Group Styling */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ddd;
        }

        /* Input Field Styling */
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Button Styling */
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #2575fc, #6a11cb);
            box-shadow: 0 0 15px rgba(37, 117, 252, 0.6);
        }

        /* Grid Background Animation */
        .booking-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.05) 75%, transparent 75%, transparent);
            background-size: 20px 20px;
            animation: moveGrid 4s linear infinite;
            z-index: -1;
        }

        @keyframes moveGrid {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(20px);
            }
        }

        /* Dropdown Styling */
.form-group select {
    appearance: none; /* Remove default arrow */
    -webkit-appearance: none; /* For Safari */
    -moz-appearance: none; /* For Firefox */
    background: rgba(255, 255, 255, 0.1);
    color: #fff; /* Text color for dropdown */
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 10px;
    padding: 10px;
    width: 100%;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
}

/* Dropdown Arrow */
.form-group select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 12px;
}

/* Dropdown Options Styling */
.form-group select option {
    background: #2a2a40; /* Background color for options */
    color: #fff; /* Text color for options */
    padding: 10px;
}

/* Hover and Focus Effects */
.form-group select:hover,
.form-group select:focus {
    border-color: rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.2);
    outline: none;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}
    </style>
</head>
<body>
    <div class="booking-container">
        <h2>Book Tickets</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_tour_package">Tour Package</label>
                {{ form.tour_package }}
            </div>
            <div class="form-group">
                <label for="id_travelers">Travelers</label>
                {{ form.travelers }}
            </div>
            <div class="form-group">
                <label for="id_start_date">Start Date</label>
                {{ form.start_date }}
            </div>
            <div class="form-group">
                <label for="id_end_date">End Date</label>
                {{ form.end_date }}
            </div>
            <div class="form-group">
                <label for="id_special_requests">Special Requests</label>
                {{ form.special_requests }}
            </div>
            <div class="form-group">
                <label for="id_passengers">Passengers</label>
                {{ form.passengers }}
            </div>
            <button type="submit">Confirm Booking</button>
        </form>
    </div>
</body>
</html>
